<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Serif"; src: url("serif.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Sans"; src: url("sans.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Mono"; src: url("mono.woff2") format("woff2"); font-weight: 400; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; }
  body {
    background: #f6f3ec;
    color: #14161a;
    font-family: "Sans", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* The same clipped wash the site uses behind its hero. A shape, not a glow. */
  .wash {
    position: absolute; inset: 0 0 auto 54%; height: 100%;
    background: #eee9de;
    clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%);
  }

  .pad { position: relative; padding: 64px 72px; height: 100%; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { display: block; }
  .brand span {
    font-family: "Serif", Georgia, serif;
    font-size: 46px; letter-spacing: -0.02em; line-height: 1;
  }

  .kicker {
    margin-top: auto;
    font-size: 22px; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: #7c8189;
  }

  h1 {
    font-family: "Serif", Georgia, serif;
    font-size: 132px; line-height: 0.9; letter-spacing: -0.03em;
    margin-top: 18px; max-width: 15ch;
  }
  h1 .hit { color: #c8431c; }

  .foot {
    margin-top: auto; display: flex; align-items: flex-end;
    justify-content: space-between; gap: 32px;
  }
  .sub { font-size: 27px; line-height: 1.35; color: #4b5058; max-width: 30ch; }
  .url {
    font-family: "Mono", monospace; font-size: 23px; color: #14161a;
    border: 2px solid #14161a; border-radius: 3px; padding: 10px 18px; white-space: nowrap;
  }
</style>
<div class="wash"></div>
<div class="pad">
  <div class="brand">
    <svg width="58" height="58" viewBox="0 0 32 32">
      <path d="M9 0 H23 L32 9 V23 L23 32 H9 L0 23 V9 Z" fill="#c8431c"/>
      <path d="M9.4 23.4 V9.6 L16 17.4 L22.6 9.6 V23.4" fill="none" stroke="#fffefb" stroke-width="3.1" stroke-linejoin="miter"/>
    </svg>
    <span>Mandate</span>
  </div>

  <p class="kicker">A marketplace on BNB Smart Chain</p>
  <h1>311,300 agents.<br><span class="hit">Six answer<br>the phone.</span></h1>

  <div class="foot">
    <p class="sub">We called every one of them, and published what came back.</p>
    <p class="url">mandate-coral.vercel.app</p>
  </div>
</div>
