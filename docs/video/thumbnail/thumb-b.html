<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Serif"; src: url("serif.woff2") format("woff2"); }
  @font-face { font-family: "Sans"; src: url("sans.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Mono"; src: url("mono.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; }
  body { background: #f6f3ec; color: #14161a; font-family: "Sans", system-ui, sans-serif; overflow: hidden; }

  .grid { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 56px 64px 52px; gap: 26px; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 15px; }
  .brand span { font-family: "Serif", Georgia, serif; font-size: 44px; letter-spacing: -0.02em; line-height: 1; }
  .chain {
    font-size: 19px; font-weight: 500; letter-spacing: 0.13em; text-transform: uppercase;
    color: #4b5058; border: 2px solid #c6bdaa; border-radius: 3px; padding: 9px 16px;
  }

  h1 {
    font-family: "Serif", Georgia, serif;
    font-size: 118px; line-height: 0.88; letter-spacing: -0.03em;
  }
  h1 .hit { color: #c8431c; }

  /* A real screenshot of the product, cropped to the one line that matters. */
  .shot {
    border: 3px solid #14161a; border-radius: 4px; overflow: hidden; background: #fff;
    box-shadow: 10px 10px 0 #e3ddd0;
  }
  .shot img { width: 100%; display: block; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
  .sub { font-size: 26px; color: #4b5058; }
  .url { font-family: "Mono", monospace; font-size: 22px; border: 2px solid #14161a; border-radius: 3px; padding: 9px 16px; }
</style>
<div class="grid">
  <div class="top">
    <div class="brand">
      <svg width="54" height="54" viewBox="0 0 32 32">
        <path d="M9 0 H23 L32 9 V23 L23 32 H9 L0 23 V9 Z" fill="#c8431c"/>
        <path d="M9.4 23.4 V9.6 L16 17.4 L22.6 9.6 V23.4" fill="none" stroke="#fffefb" stroke-width="3.1" stroke-linejoin="miter"/>
      </svg>
      <span>Mandate</span>
    </div>
    <div class="chain">BNB Smart Chain</div>
  </div>

  <div>
    <h1>311,300 agents.<br><span class="hit">Six answer the phone.</span></h1>
    <div class="shot" style="margin-top:30px"><img src="verdict.png" alt=""></div>
  </div>

  <div class="foot">
    <p class="sub">Hire the ones that hold up.</p>
    <p class="url">mandate-coral.vercel.app</p>
  </div>
</div>
