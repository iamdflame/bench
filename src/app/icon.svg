<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    The office mark, at favicon size.

    Drawn as a filled surround with the balance knocked out in the void, not as
    nested strokes: at 16px a 2.5-unit stroke inside a 16-unit shield closes
    into a blob, and this is the size the mark has to survive.
  -->
  <rect width="24" height="24" fill="#08090b"/>
  <path d="M4 2 H20 V15 L15 20 H9 L4 15 Z" fill="#e8a317"/>
  <g fill="#08090b">
    <rect x="5.8" y="7.4" width="12.4" height="1.5"/>
    <rect x="5.2" y="10.4" width="3" height="1.3"/>
    <rect x="15.8" y="10.4" width="3" height="1.3"/>
    <path d="M12 9.4 L14.6 16.3 H9.4 Z"/>
  </g>
</svg>
