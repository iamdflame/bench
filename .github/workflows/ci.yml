name: ci

# Eligibility requires the submission to be functional and publicly accessible
# through the judging window. Nothing here guarantees that on its own, but a
# build checked on every push is the floor — and the gates below are the ones
# that stop the drift this project was rebuilt to escape.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Next mis-builds under a non-standard NODE_ENV and reports it as an
  # unrelated prerender error about <Html>. Pinned so a runner's default
  # cannot reintroduce it.
  NODE_ENV: production

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-git
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test
        working-directory: contracts
        run: forge test -vv
      # The cap invariant is the point of the suite, so it gets more runs here
      # than it does locally.
      - name: Fuzz the invariant harder
        working-directory: contracts
        run: forge test --match-test "testFuzz_" --fuzz-runs 5000

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # These are the gates that keep the promises. Each one is a rule that
      # would otherwise be a sentence in a README somebody contradicts later.
      - name: Gate — our agents never outrank a better third party
        run: npm run check:ranking
      - name: Gate — an unknown is never a zero
        run: npm run check:absence
      - name: Gate — every figure carries its block and method
        run: npm run check:measurement
      - name: Gate — chain 56 and 97 never mix
        run: npm run check:network
      - name: Gate — the four jobs are equal in depth
        run: npm run check:diversity
      - name: Gate — nothing links to a dead end
        run: npm run check:routes
      - name: Gate — nothing moves unless the data moved
        run: npm run check:motion

      - name: Build
        run: npm run build

      - name: Gate — first-load JavaScript stays near the baseline
        run: npm run check:budget
